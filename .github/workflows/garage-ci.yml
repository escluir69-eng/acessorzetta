name: Garagem CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/garage-vehicle-evolution]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Unit tests
        run: bun run test
      - name: Lint
        run: bun run lint
      - name: Production build
        run: bun run build
